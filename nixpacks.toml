# Adds ffmpeg + libopus to the build image on top of Nixpacks' auto-
# detected Python setup (still installs from requirements.txt and runs
# the Procfile as normal). Both are needed for voice playback:
# - ffmpeg: discord.py shells out to it to decode whatever yt-dlp hands
#   back into raw PCM audio.
# - libopus: discord.py's voice client encodes that PCM into Opus itself
#   (via a ctypes binding) before sending it over the voice connection —
#   without the system library, playback fails with OpusNotLoaded even
#   though ffmpeg is present.
[phases.setup]
nixPkgs = ["ffmpeg", "libopus"]
